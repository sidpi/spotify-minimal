<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>now playing</title>
<style>
  :root {
    --bg: #000;
    --fg: #ffffff;
    --dim: #b3b3b3;
    --accent: #1ed760;
    --panel: #121212;
    --border: #1f1f1f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
  input[type="range"] { touch-action: none; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  .bg-art {
    position: fixed; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(64px) brightness(.4);
    opacity: 0; transition: opacity .8s ease;
    z-index: 0;
  }
  body.playing .bg-art { opacity: 1; }
  main {
    position: relative; z-index: 1;
    width: min(96vw, 1100px);
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px;
  }
  .player-col {
    width: min(92vw, 420px); text-align: center; flex-shrink: 0;
    margin-right: clamp(24px, 6vw, 64px);
    transition: width .5s cubic-bezier(.4,0,.2,1), margin-right .5s cubic-bezier(.4,0,.2,1);
  }
  .plists-col {
    flex: 0 0 auto; width: min(44vw, 520px);
    min-height: 62vh; min-height: 62dvh; text-align: left;
    transition: width .5s cubic-bezier(.4,0,.2,1), opacity .4s ease,
                transform .5s cubic-bezier(.4,0,.2,1), min-height .5s ease;
  }
  main.focused .plists-col {
    width: 0; min-height: 0; opacity: 0;
    transform: translateX(40px);
    pointer-events: none; overflow: hidden;
  }
  main.focused .player-col { margin-right: 0; }
  .col-head {
    margin-top: 18px; color: var(--dim);
    font-size: 12px; letter-spacing: .6px; text-transform: uppercase;
  }
  #likedBtn { margin-top: 10px; }
  .whoami {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--dim); font-size: 12px;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .whoami img {
    width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  }
  .whoami span { overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 480px) { .whoami { max-width: 90px; } }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .plists-col > div { animation: viewIn .28s ease; }
  .plists-col > div.out {
    animation: none;
    opacity: 0; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s ease;
  }
  @media (max-width: 840px) {
    main {
      flex-direction: column;
      padding: calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    }
    .player-col { margin-right: 0; }
    .plists-col { width: min(92vw, 520px); }
  }
  /* Touch-first tuning: bigger art, roomier tap targets, no double-tap zoom */
  @media (hover: none), (pointer: coarse) {
    .art { width: min(70vw, 300px); height: min(70vw, 300px); }
    main.focused .art { width: min(78vw, 330px); height: min(78vw, 330px); }
    .controls { gap: 14px; }
    button.icon { min-width: 44px; min-height: 44px; }
    .vol-btn { min-width: 40px; min-height: 40px; padding: 8px; }
    /* Touch has no hover — the overlay play button stays visible. */
    .art-play { opacity: 1; translate: 0 0; }
  }
  .art {
    position: relative;
    width: min(58vw, 240px); height: min(58vw, 240px);
    margin: 0 auto 26px;
    border-radius: 16px; overflow: hidden;
    background: var(--panel);
    box-shadow: 0 24px 64px rgba(0,0,0,.55);
    cursor: pointer;
    transition: width .5s cubic-bezier(.4,0,.2,1), height .5s cubic-bezier(.4,0,.2,1),
                border-radius .5s ease, box-shadow .5s ease;
  }
  .art:hover { box-shadow: 0 28px 72px rgba(0,0,0,.65); }
  main.focused .art {
    width: min(64vw, 340px); height: min(64vw, 340px);
    border-radius: 20px; box-shadow: 0 32px 80px rgba(0,0,0,.6);
  }
  /* The album art sits on a spinning vinyl — the CodeFronts turntable
     pattern: the disc spins at a constant rate while playing and freezes
     exactly where it stopped on pause (animation-play-state), the tonearm
     swings onto the groove, and the art itself becomes the circular label. */
  .disc {
    position: absolute; inset: 3.5%;
    border-radius: 50%;
    display: grid; place-items: center;
    background:
      repeating-radial-gradient(circle at 50% 50%,
        oklch(0.15 0.005 260) 0 2px, oklch(0.19 0.008 260) 2px 4px),
      conic-gradient(from 210deg, transparent 0deg, oklch(1 0 0/.08) 24deg,
        transparent 60deg, transparent 200deg, oklch(1 0 0/.05) 232deg, transparent 268deg);
    box-shadow: inset 0 0 0 1px oklch(1 0 0/.06);
    animation: discSpin 3.6s linear infinite;
    animation-play-state: paused;
  }
  body.playing .disc { animation-play-state: running; }
  @keyframes discSpin { to { rotate: 360deg; } }
  .art-ph {
    position: relative; z-index: 1;
    width: 56%; height: 56%;
    border-radius: 50%; overflow: hidden;
    background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: var(--dim);
    box-shadow: 0 0 0 1px oklch(0 0 0/.45), 0 6px 18px oklch(0 0 0/.35);
  }
  .art img {
    width: 100%; height: 100%; object-fit: cover;
    animation: artIn .45s ease;
  }
  @keyframes artIn {
    from { opacity: 0; transform: scale(.97); }
    to { opacity: 1; transform: none; }
  }
  .spindle {
    position: absolute; top: 50%; left: 50%;
    translate: -50% -50%; z-index: 2;
    width: 9px; height: 9px; border-radius: 50%;
    background: oklch(0.75 0.01 260);
    box-shadow: inset 0 -1px 2px oklch(0 0 0/.6), 0 0 0 1px oklch(0 0 0/.35);
    pointer-events: none;
  }
  .arm {
    position: absolute; top: 14px; right: 12px; z-index: 3;
    width: 14px; height: 14px; border-radius: 50%;
    background: linear-gradient(135deg, oklch(0.78 0.01 260), oklch(0.6 0.01 260));
    box-shadow: 0 0 0 1px oklch(0 0 0/.35), 0 2px 6px oklch(0 0 0/.4);
    transform-origin: 50% 50%;
    rotate: -26deg;
    transition: rotate .7s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
  }
  .arm i {
    position: absolute; top: 6px; left: 6px;
    width: 6px; height: 118px; border-radius: 4px;
    background: linear-gradient(180deg, oklch(0.8 0.01 260), oklch(0.6 0.01 260));
    transform-origin: top center;
    rotate: 22deg;
  }
  .arm i::after {
    content: '';
    position: absolute; bottom: -6px; left: -5px;
    width: 16px; height: 14px; border-radius: 3px;
    background: oklch(0.32 0.01 260);
    box-shadow: 0 2px 4px oklch(0 0 0/.5);
  }
  body.playing .arm { rotate: 6deg; }
  /* Circular play/pause button overlaid on the album art — the CodeFronts
     Spotify-inspired pattern: lifts + fades in on hover/focus, scales on
     press, stays pinned while playing (body.playing), with equalizer bars.
     Independent translate + scale keeps the two motions from fighting. */
  .art-play {
    position: absolute; right: 10px; bottom: 10px; z-index: 1;
    display: grid; place-items: center;
    width: 52px; height: 52px;
    border: 0; border-radius: 50%;
    background: var(--accent); color: #000;
    cursor: pointer;
    opacity: 0; translate: 0 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,.5);
    transition: opacity .28s, translate .28s cubic-bezier(.34,1.4,.5,1), scale .18s;
  }
  body.playing .art-play,
  .art:hover .art-play,
  .art:focus-within .art-play {
    opacity: 1; translate: 0 0;
  }
  .art-play:disabled { opacity: 0 !important; translate: 0 12px !important; }
  .art-play:hover { scale: 1.08; }
  .art-play:active { scale: .94; }
  .art-play:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .art-play svg, .controls svg { display: block; }
  .pp-q, .pp-r1 { display: none; }
  body.playing .pp-p { display: none; }
  body.playing .pp-q { display: block; }
  .r1 .pp-r1 { display: block; }
  .art-eq {
    position: absolute; left: 10px; bottom: 14px; z-index: 1;
    display: flex; align-items: flex-end; gap: 3px;
    height: 18px; opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  .art-eq b {
    width: 3px; height: 35%; border-radius: 2px;
    background: var(--accent);
    animation: artEq .8s ease-in-out infinite alternate;
    animation-play-state: paused;
  }
  .art-eq b:nth-child(2) { animation-delay: -.2s; }
  .art-eq b:nth-child(3) { animation-delay: -.5s; }
  .art-eq b:nth-child(4) { animation-delay: -.75s; }
  body.playing .art-eq { opacity: 1; }
  body.playing .art-eq b { animation-play-state: running; }
  @keyframes artEq {
    from { height: 22%; }
    to { height: 100%; }
  }
  .player-col:has(.art:hover) .title,
  .player-col:has(.art:focus-within) .title { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .art-play, .art-eq b, .disc, .arm {
      transition-duration: .01ms !important;
      animation: none !important;
    }
  }
  .title {
    font-size: 22px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .25s;
  }
  .artist { color: var(--dim); margin-top: 6px; font-size: 15px; }
  .seek-row {
    display: flex; align-items: center; gap: 14px;
    margin-top: 30px;
  }
  .seek-row .seek {
    flex: 1; width: auto;
    accent-color: var(--accent); cursor: pointer;
  }
  .seek:disabled { cursor: default; }
  .times {
    display: flex; justify-content: space-between;
    color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .controls {
    display: flex; align-items: center; justify-content: center;
    gap: 30px; margin: 28px 0 0;
  }
  /* Shared button language — every control gets the same silhouette and
     motion: lift on hover, press scale, and one consistent focus ring, so
     nothing in the UI feels foreign. */
  :where(button, a, [role="button"]) { -webkit-tap-highlight-color: transparent; }
  :where(button, a, [role="button"]):focus-visible {
    outline: 3px solid var(--fg); outline-offset: 3px;
  }
  button.icon {
    background: none; border: none; color: var(--fg);
    font-size: 20px; cursor: pointer; line-height: 1;
    transition: transform .18s cubic-bezier(.34,1.4,.5,1), color .15s;
  }
  button.icon:hover { color: var(--accent); }
  button.icon:active { transform: scale(.88); opacity: .8; }
  button.icon.on { color: var(--accent); }
  button.icon:disabled {
    opacity: .35; cursor: default; transform: none; color: var(--fg);
  }
  button.big {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: #000; border: none;
    font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.4);
    transition: transform .22s cubic-bezier(.34,1.4,.5,1), background .25s, box-shadow .25s;
  }
  button.big:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 12px 26px rgba(0,0,0,.5); }
  button.big:active { transform: scale(.93); box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  button.big:disabled {
    background: var(--border); color: var(--dim); cursor: default;
    transform: none; box-shadow: none;
  }
  .vol-wrap { position: relative; display: inline-block; }
  .vol-btn {
    background: none; border: none; color: var(--dim);
    font-size: 15px; cursor: pointer; line-height: 1; padding: 6px;
    transition: color .15s, transform .18s cubic-bezier(.34,1.4,.5,1);
  }
  .vol-btn:hover { color: var(--fg); transform: translateY(-2px); }
  .vol-btn:active { transform: scale(.9); }
  .vol-btn svg { display: block; margin: 0 auto; }
  .vol-btn .vi-mute, .vol-btn .vi-low { display: none; }
  .vol-btn.muted .vi-mute { display: block; }
  .vol-btn.low .vi-low { display: block; }
  .vol-btn.muted .vi-high, .vol-btn.low .vi-high { display: none; }
  .vol-pop {
    position: absolute; top: calc(100% + 10px); left: 50%;
    transform: translate(-50%, -6px);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    z-index: 3;
  }
  .vol-pop input { width: 120px; accent-color: var(--accent); cursor: pointer; }
  .vol-pop input:disabled { cursor: default; }
  .vol-wrap:hover .vol-pop, .vol-wrap:focus-within .vol-pop,
  .vol-wrap.open .vol-pop {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translate(-50%, 0);
  }
  .link-btn {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    color: var(--fg); font-weight: 500;
    border-radius: 999px; padding: 9px 18px; font-size: 13px; cursor: pointer;
    margin-top: 18px;
    transition: transform .22s cubic-bezier(.34,1.4,.5,1), background .25s,
                color .15s, border-color .2s;
  }
  .quick-links {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px;
  }
  .quick-links .link-btn { margin-top: 0; }
  .link-btn:hover {
    background: rgba(255,255,255,.12); border-color: var(--dim);
    transform: translateY(-2px);
  }
  .link-btn:active { transform: scale(.96); }
  .link-btn:disabled { opacity: .4; cursor: default; transform: none; }
  .player-foot {
    position: fixed; z-index: 4;
    top: calc(14px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
    display: flex; align-items: center; gap: 10px;
  }
  #plistFocusBtn { display: none; }
  main.focused #plistFocusBtn {
    display: inline-block;
    animation: viewIn .28s ease;
  }
  .queue {
    text-align: left;
    opacity: 0; visibility: hidden; transform: translateY(6px);
    max-height: 0; overflow: hidden; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease, visibility .25s,
                max-height .3s ease, margin-top .3s ease;
  }
  .player-col:hover .queue.show {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: none; max-height: 230px; margin-top: 26px;
  }
  .q-head {
    color: var(--dim); font-size: 12px; letter-spacing: .6px;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .q-list {
    border: 1px solid var(--border); border-radius: 12px;
    background: rgba(24,24,27,.65); overflow: hidden;
  }
  .q-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  .q-item:last-child { border-bottom: none; }
  .q-item:hover { background: rgba(255,255,255,.06); }
  .q-item img, .q-item .noimg {
    width: 32px; height: 32px; border-radius: 5px; object-fit: cover;
    background: var(--panel); flex-shrink: 0;
  }
  .q-item .noimg {
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px;
  }
  .q-main { min-width: 0; flex: 1; }
  .q-name {
    font-size: 13px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .q-sub {
    font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  @media (hover: none) {
    .queue.show {
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: none; max-height: 230px; margin-top: 26px;
    }
  }
  .plists {
    margin-top: 14px;
    max-height: 62vh; max-height: 62dvh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    border: 1px solid var(--border); border-radius: 12px;
    background: rgba(24,24,27,.65); text-align: left;
  }
  .plists[hidden] { display: none; }
  .pl-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .pl-item:last-child { border-bottom: none; }
  .pl-item:hover { background: rgba(255,255,255,.05); }
  .pl-item img {
    width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
    background: var(--panel); flex-shrink: 0;
  }
  .pl-item .noimg {
    width: 40px; height: 40px; border-radius: 6px; background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); flex-shrink: 0;
  }
  .pl-item .pl-main { min-width: 0; flex: 1; }
  .pl-item .pl-name {
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pl-item .pl-sub { font-size: 12px; color: var(--dim); }
  .track-head {
    margin: 16px 0 8px; font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trk-idx { width: 22px; color: var(--dim); font-size: 12px; flex-shrink: 0; text-align: right; }
  .trk-dur { color: var(--dim); font-size: 12px; flex-shrink: 0; }
  .meta { margin-top: 20px; color: var(--dim); font-size: 13px; min-height: 18px; }
  #status { margin-top: 12px; color: var(--accent); font-size: 13px; min-height: 18px; }
  #status.err { color: #ff5f56; }
  #toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .3s ease; z-index: 2;
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #debug {
    position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 5;
    background: rgba(0,0,0,.88); border: 1px solid var(--border);
    color: #9f9; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 8px; max-height: 32vh; overflow-y: auto; text-align: left;
    white-space: pre-wrap;
  }
  a.connect {
    display: inline-block; margin-top: 18px; padding: 12px 28px;
    background: var(--accent); color: #000; border-radius: 999px;
    text-decoration: none; font-weight: 600; font-size: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    transition: transform .22s cubic-bezier(.34,1.4,.5,1), background .25s, box-shadow .25s;
  }
  a.connect:hover {
    background: #1fea67;
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(0,0,0,.45);
  }
  a.connect:active { transform: scale(.96); }
  a.switch-account {
    display: block; margin-top: 12px;
    color: var(--dim); font-size: 12px; text-decoration: underline;
  }
  a.switch-account:hover { color: var(--fg); }
</style>
</head>
<body>
<div class="bg-art" id="bg-art"></div>

<main>
  <section class="player-col">
    <div class="art" id="art">
      <div class="disc">
        <span class="art-ph" id="artPh" aria-hidden="true">♫</span>
        <span class="spindle" aria-hidden="true"></span>
      </div>
      <span class="arm" aria-hidden="true"><i></i></span>
      <span class="art-eq" aria-hidden="true"><b></b><b></b><b></b><b></b></span>
      <button class="art-play" id="artPlay" type="button" aria-pressed="false" aria-label="Play / pause" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path class="pp-p" d="M8.6 5.4v13.2L19 12z" fill="currentColor"/>
          <path class="pp-q" d="M8 5h3.1v14H8zM12.9 5H16v14h-3.1z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="title" id="title">—</div>
    <div class="artist" id="artist">not connected</div>

    <div class="controls">
      <button class="icon" id="shuffle" title="Shuffle" aria-label="Shuffle" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">

<script>
"use strict";

// ---------------------------------------------------------------------------
// Config — API_BASE is filled in for your project (wrnidxaoijyopcfnenlw).
// ANON_KEY: your Supabase publishable (anon) key — public by design, safe to
//   embed. Sent as `Authorization: Bearer` on every API call; the player and
//   control functions are JWT-verified by Supabase's gateway.
// ---------------------------------------------------------------------------
const API_BASE =
  new URLSearchParams(location.search).get("api") ||
  "https://wrnidxaoijyopcfnenlw.supabase.co/functions/v1";
const ANON_KEY = "sb_publishable_Dp0eF_zbNO15piMwROe1aA_f5JKEp7Z";

const $ = (id) => document.getElementById(id);
const title = $("title"), artist = $("artist"), art = $("art"),
      bgArt = $("bg-art"), pos = $("pos"), dur = $("dur"),
      playBtn = $("play"), artPlay = $("artPlay"), artPh = $("artPh"),
      prevBtn = $("prev"), nextBtn = $("next"),
      shuffleBtn = $("shuffle"), repeatBtn = $("repeat"),
      volume = $("volume"), volLabel = $("volLabel"),
      seek = $("seek"),
      volBtn = $("volBtn"), queue = $("queue"), qList = $("qList"),
      plistFocusBtn = $("plistFocusBtn"), whoami = $("whoami"),
      mainEl = document.querySelector("main"),
      meta = $("meta"), statusEl = $("status"), toastEl = $("toast"),
      plistBtn = $("plistBtn"), plists = $("plists"), likedBtn = $("likedBtn"),
      daylistBtn = $("daylistBtn"),
      logoutBtn = $("logoutBtn"),
      plistView = $("plistView"), trackView = $("trackView"),
      backBtn = $("backBtn"), trackHead = $("trackHead"), tracks = $("tracks"),
      debugEl = $("debug");

const DEBUG = new URLSearchParams(location.search).get("debug") !== null;
if (DEBUG) debugEl.hidden = false;
function log(...args) {
  const line = "[" + new Date().toISOString().slice(11, 23) + "] " + args.join(" ");
  if (DEBUG) {
    debugEl.textContent += line + "\n";
    debugEl.scrollTop = debugEl.scrollHeight;
  }
  console.log(line);
}

let player = null;
let deviceId = null;
let current = null; // { paused, position, duration }
let seeking = false;
let shuffleOn = false;
let repeatMode = "off"; // off | context | track
let currentPlaylist = null; // { id, name, tracks }
let sdkNext = [];           // upcoming tracks from the SDK's track window
let playlistOffset = -1;    // index of the last track started in currentPlaylist
let queueItems = [];        // rendered "up next" items
let artImg = null;          // the album-art <img>, created on first track

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
const fmt = (ms) => {
  if (!ms && ms !== 0) return "0:00";
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

const setStatus = (msg, err) => {
  statusEl.textContent = msg;
  statusEl.classList.toggle("err", !!err);
};

let toastTimer;
const toast = (msg) => {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 4000);
};

// Safe storage access — private browsing can throw on localStorage.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// Multi-user identity: each browser gets a random anonymous id plus a
// server-issued secret granted during OAuth (returned only in the #session=
// fragment). Both go out as headers on every call, so each visitor's Spotify
// session is isolated from everyone else's. Returns null when storage is
// blocked — the page then falls back to legacy single-user behavior.
function getUserId() {
  let id = store.get("music_player_id");
  if (!id) {
    id = (crypto.randomUUID && crypto.randomUUID()) ||
      Array.from(crypto.getRandomValues(new Uint8Array(16)))
        .map((b) => b.toString(16).padStart(2, "0")).join("");
    store.set("music_player_id", id);
  }
  return store.get("music_player_id");
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  headers["Authorization"] = "Bearer " + ANON_KEY;
  const uid = getUserId();
  if (uid) headers["x-app-user"] = uid;
  const sec = store.get("music_player_secret");
  if (sec) headers["x-app-secret"] = sec;
  const res = await fetch(API_BASE + path, { ...opts, headers });
  // 401 = not connected, 403 = session invalid/expired — both land on the
  // reconnect screen instead of silently mixing sessions.
  if (res.status === 401 || res.status === 403) return { __unauthorized: true };
  return res.json();
}

// ---------------------------------------------------------------------------
// UI rendering
// ---------------------------------------------------------------------------
function render(track, position, duration, paused) {
  title.textContent = track.name || "—";
  artist.textContent = track.artists || "—";
  // The album art is replaced in place — the overlay play button and the
  // equalizer bars live beside the image and must survive every re-render.
  if (track.image && (!artImg || artImg.src !== track.image)) {
    if (!artImg) {
      artImg = document.createElement("img");
      artImg.alt = "";
      artPh.replaceChildren(artImg);
    }
    artImg.src = track.image;
    bgArt.style.backgroundImage = `url(${track.image})`;
  }
  dur.textContent = fmt(duration);
  updatePos(position, duration);
  artPlay.setAttribute("aria-pressed", String(!paused));
  artPlay.setAttribute("aria-label", paused ? "Play" : "Pause");
  document.body.classList.toggle("playing", !paused);
  playBtn.disabled = prevBtn.disabled = nextBtn.disabled = shuffleBtn.disabled =
    repeatBtn.disabled = plistBtn.disabled = artPlay.disabled = false;
  // Mobile: lock-screen info + keep the screen awake while playing.
  updateMediaSession(track, paused);
  if (paused) releaseWakeLock(); else requestWakeLock();
}

function updatePos(position, duration) {
  if (seeking) return;
  pos.textContent = fmt(position);
  seek.value = duration ? Math.round((position / duration) * 1000) : 0;
}

// Ticking progress while playing (SDK only fires on track change / pause).
setInterval(() => {
  if (current && !current.paused && !seeking) {
    current.position = Math.min(current.position + 1000, current.duration);
    updatePos(current.position, current.duration);
  }
}, 1000);

// ---------------------------------------------------------------------------
// Web Playback SDK
// ---------------------------------------------------------------------------
function initPlayer() {
  player = new Spotify.Player({
    name: "minimal player",
    getOAuthToken: (cb) =>
      api("/player/token").then((r) =>
        cb(typeof r.access_token === "string" ? r.access_token : "")),
    volume: volume.value / 100,
  });

  player.addListener("ready", async ({ device_id }) => {
    deviceId = device_id;
    log("SDK ready, device =", device_id);
    api("/player/device", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device_id }),
    });
    setStatus("ready");
    await refreshNowPlaying();
  });

  player.addListener("player_state_changed", (s) => {
    if (!s) return;
    const t = s.track_window.current_track;
    log("state:", s.paused ? "PAUSED" : "PLAYING", "pos=" + s.position, "track=" + t.name);
    current = { paused: s.paused, position: s.position, duration: s.duration };
    shuffleOn = !!s.shuffle;
    repeatMode = s.repeat_mode || "off";
    setModeUI();
    sdkNext = (s.track_window.next_tracks || []).map((t) => ({
      name: t.name,
      artists: (t.artists || []).map((a) => a.name).join(", "),
      uri: t.uri,
      image: t.album?.images?.[0]?.url || "",
    }));
    renderQueue();
    render(
      {
        name: t.name,
        artists: (t.artists || []).map((a) => a.name).join(", "),
        image: t.album?.images?.[0]?.url,
        album: t.album?.name || "",
      },
      s.position, s.duration, s.paused,
    );
  });

  player.addListener("initialization_error", (e) => {
    log("EVENT initialization_error", (e && e.message) || "");
    setStatus("SDK init error", true);
  });
  player.addListener("authentication_error", (e) => {
    log("EVENT authentication_error", (e && e.message) || "");
    setStatus("Auth error — reconnect", true);
  });
  player.addListener("account_error", (e) => {
    log("EVENT account_error", (e && e.message) || "");
    setStatus("Spotify Premium required", true);
  });
  player.addListener("not_ready", ({ device_id }) => {
    log("EVENT not_ready", device_id);
    setStatus("player disconnected", true);
  });
  player.addListener("playback_error", (e) => {
    log("EVENT playback_error", (e && e.message) || "unknown");
    setStatus("playback error: " + ((e && e.message) || "unknown"), true);
  });
}

// Create + connect the SDK player inside the first user gesture. Creating it
// at page load leaves Chrome/Edge free to suspend the audio after ~10s; a
// player born inside a click is granted autoplay activation from the start.
async function ensurePlayer() {
  if (player) return;
  if (!window.Spotify) throw new Error("SDK failed to load");
  setStatus("connecting player…");
  log("ensurePlayer: creating player");
  initPlayer();
  const ok = await player.connect().catch(() => false);
  log("ensurePlayer: connect() ->", ok);
  const deadline = Date.now() + 8000;
  while (!deviceId && Date.now() < deadline) {
    await new Promise((r) => setTimeout(r, 200));
  }
  log("ensurePlayer: deviceId =", deviceId || "NONE");
  if (!deviceId) throw new Error("player did not become ready");
}

// ---------------------------------------------------------------------------
// Server truth — polled every 10s so a reload always shows real state
// ---------------------------------------------------------------------------
async function refreshNowPlaying() {
  try {
    const r = await api("/player/now-playing");
    log("poll:", r && r.track ? (r.playing ? "playing" : "paused") + " " + r.track.name + " @" + r.progress_ms : (r && r.__unauthorized ? "unauthorized" : "nothing"));
    if (r && r.track) {
      current = { paused: !r.playing, position: r.progress_ms, duration: r.track.duration_ms };
      render(r.track, r.progress_ms, r.track.duration_ms, !r.playing);
      meta.textContent = "playing · " + (currentPlaylistName || "your playlist");
    } else if (r && r.__unauthorized) {
      setStatus("Not connected — press Connect Spotify", true);
      showConnect();
    }
  } catch (e) { /* transient */ }
}
// ?poll=0 disables the 10s server poll (diagnostic: does the mute correlate?)
const POLL_MS = parseInt(new URLSearchParams(location.search).get("poll") || "10000", 10);
if (POLL_MS > 0) setInterval(refreshNowPlaying, POLL_MS);
log("boot: poll=" + POLL_MS + "ms debug=" + DEBUG);

// ---------------------------------------------------------------------------
// Autoplay handling
// ---------------------------------------------------------------------------
// Chrome/Edge suspend the SDK's audio element after ~10s if playback was
// started without a direct SDK call inside the user's click gesture. After a
// REST-started playback we wait for the SDK to receive the new state, then
// resume it directly — all within the browser's transient-activation window.
async function ensureSdkResumed() {
  const deadline = Date.now() + 4000;
  while (Date.now() < deadline) {
    try {
      const st = await player.getCurrentState();
      if (st && st.track_window && st.track_window.current_track) {
        if (st.paused) await player.resume().catch(() => {});
        return;
      }
    } catch (e) { /* player not ready yet */ }
    await new Promise((r) => setTimeout(r, 200));
  }
}

// ---------------------------------------------------------------------------
// Mobile: wake lock + lock-screen media controls
// ---------------------------------------------------------------------------
let wakeLock = null;

async function requestWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { /* unsupported */ }
}

function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (e) { /* ignore */ } wakeLock = null; }
}

// Re-acquire the lock when the tab returns to the foreground while playing.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && current && !current.paused) requestWakeLock();
});

function updateMediaSession(track, paused) {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.name || "",
      artist: track.artists || "",
      album: track.album || "",
      artwork: track.image ? [{ src: track.image, sizes: "512x512" }] : [],
    });
    navigator.mediaSession.playbackState = paused ? "paused" : "playing";
    const set = (action, handler) => {
      try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) { /* unsupported */ }
    };
    set("play", () => player && player.resume());
    set("pause", () => player && player.pause());
    set("previoustrack", () => player && player.previousTrack());
    set("nexttrack", () => player && player.nextTrack());
    set("seekto", (d) => {
      if (player && d && typeof d.seekTime === "number") player.seek(Math.round(d.seekTime * 1000));
    });
  } catch (e) { /* media session unavailable */ }
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
async function togglePlay() {
  log("click: play button");
  try {
    await ensurePlayer();
  } catch (e) {
    log("ensurePlayer failed:", (e && e.message) || e);
    setStatus("player failed: " + ((e && e.message) || e), true);
    return;
  }
  const s = await player.getCurrentState();
  log("play click: current state =", s ? (s.paused ? "paused" : "playing") + " " + (s.track_window.current_track ? s.track_window.current_track.name : "?") : "none");
  if (!s) {
    // Nothing loaded yet — start the playlist server-side on this device.
    setStatus("starting playlist…");
    try {
      const r = await api("/control/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: deviceId }),
      });
      if (r && r.error) throw new Error(r.error);
      await ensureSdkResumed();
    } catch (e) {
      const msg = String((e && e.message) || e);
      setStatus(
        msg.includes("404") || msg.includes("active device")
          ? "no active device — keep this tab open, then retry"
          : "failed to start playback: " + msg,
        true,
      );
    }
    return;
  }
  s.paused ? player.resume() : player.pause();
}

playBtn.addEventListener("click", togglePlay);
// The overlay button on the album art drives the same logic; stop the click
// from also toggling focus mode (the art itself is clickable for that).
artPlay.addEventListener("click", (e) => {
  e.stopPropagation();
  togglePlay();
});

prevBtn.addEventListener("click", () => player && player.previousTrack());
nextBtn.addEventListener("click", () => player && player.nextTrack());

// ---- shuffle / repeat -------------------------------------------------------
function setModeUI() {
  shuffleBtn.classList.toggle("on", shuffleOn);
  repeatBtn.classList.toggle("on", repeatMode !== "off");
  repeatBtn.classList.toggle("r1", repeatMode === "track");
  repeatBtn.title =
    repeatMode === "track"
      ? "Repeat one"
      : repeatMode === "context"
        ? "Repeat all"
        : "Repeat off";
}

shuffleBtn.addEventListener("click", () => {
  if (!player) return;
  shuffleOn = !shuffleOn;
  setModeUI();
  player.setShuffle(shuffleOn).catch(() => {});
});

repeatBtn.addEventListener("click", () => {
  if (!player) return;
  const modes = ["off", "context", "track"];
  repeatMode = modes[(modes.indexOf(repeatMode) + 1) % modes.length];
  setModeUI();
  player.setRepeat(repeatMode).catch(() => {});
});

function setVolIcon() {
  const v = +volume.value;
  volBtn.classList.toggle("muted", v === 0);
  volBtn.classList.toggle("low", v > 0 && v < 50);
  volBtn.classList.toggle("high", v >= 50);
}

volume.addEventListener("input", () => {
  volLabel.textContent = volume.value + "%";
  setVolIcon();
  if (player) player.setVolume(volume.value / 100);
});

// Tap-to-toggle the volume popover (touch devices have no hover).
volBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  volBtn.parentElement.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".vol-wrap")) {
    const open = document.querySelector(".vol-wrap.open");
    if (open) open.classList.remove("open");
  }
});

// ---- seek bar -------------------------------------------------------------
seek.addEventListener("pointerdown", () => { seeking = true; });
seek.addEventListener("input", () => {
  if (!current) return;
  const pct = seek.value / 1000;
  pos.textContent = fmt(Math.round(pct * current.duration));
});
seek.addEventListener("change", async () => {
  if (!current || !player) { seeking = false; return; }
  const pct = seek.value / 1000;
  const target = Math.round(pct * current.duration);
  try { await player.seek(target); } catch (e) { /* ignore */ }
  current.position = target;
  updatePos(target, current.duration);
  seeking = false;
});
seek.addEventListener("pointerup", () => { seeking = false; });
seek.addEventListener("pointercancel", () => { seeking = false; });

logoutBtn.addEventListener("click", async () => {
  toast("Logging out…");
  await api("/auth/logout", { method: "POST" });
  store.del("music_player_secret");
  location.reload();
});

// ---------------------------------------------------------------------------
// Playlist browser
// ---------------------------------------------------------------------------
let currentPlaylistName = "";

async function loadPlaylists() {
  try {
    const r = await api("/player/playlists");
    if (!r || !r.playlists) return;
    plists.innerHTML = "";
    if (!r.playlists.length) {
      plists.innerHTML =
        '<div class="pl-item" style="cursor:default"><span class="pl-sub">no playlists found</span></div>';
      return;
    }
    for (const p of r.playlists) {
      const el = document.createElement("div");
      el.className = "pl-item";
      el.innerHTML =
        (p.image ? `<img src="${p.image}" alt="">` : '<div class="noimg">♪</div>') +
        '<div class="pl-main"><div class="pl-name"></div><div class="pl-sub"></div></div>';
      el.querySelector(".pl-name").textContent = p.name;
      el.querySelector(".pl-sub").textContent = p.owner;
      el.addEventListener("click", () => openPlaylist(p));
      plists.appendChild(el);
    }
  } catch (e) { /* transient */ }
}

async function openPlaylist(p) {
  log("open playlist:", p.name, p.id);
  currentPlaylistName = p.name;
  setStatus("loading tracks…");
  try {
    const r = await api("/player/playlist?id=" + encodeURIComponent(p.id));
    if (r && r.error) throw new Error(r.error);
    currentPlaylist = { id: p.id, name: p.name, tracks: r.tracks || [], listable: r.listable !== false };
    renderTracks();
    await switchView(trackView, plistView);
    setStatus("ready");
  } catch (e) {
    setStatus("failed to load tracks: " + ((e && e.message) || e), true);
  }
}

// Liked Songs — opens the same drill-down track list as a playlist, so you
// can pick a specific saved song instead of just playing the whole collection.
async function openLiked() {
  log("open liked songs");
  currentPlaylistName = "Liked Songs";
  setStatus("loading liked songs…");
  try {
    const r = await api("/player/liked");
    if (r && r.error) throw new Error(r.error);
    currentPlaylist = { id: "liked", name: "Liked Songs", tracks: r.tracks || [], listable: true };
    renderTracks();
    await switchView(trackView, plistView);
    setStatus("ready");
  } catch (e) {
    // Browsing needs the `user-library-read` scope; older connections made
    // before the scope existed 403 here. Show a reconnect button in the
    // track view instead of silently falling back to playback, so the list
    // can actually appear once they reconnect.
    renderLikedReconnect();
    await switchView(trackView, plistView);
    setStatus("couldn't load the list — reconnect Spotify to browse liked songs", true);
  }
}

function renderLikedReconnect() {
  trackHead.textContent = "Liked Songs";
  tracks.innerHTML = "";
  const box = document.createElement("div");
  box.className = "pl-item";
  box.style.cssText = "cursor:default;flex-direction:column;align-items:flex-start;gap:12px;padding:14px";
  box.innerHTML =
    "<span class=\"pl-sub\">Browsing your saved songs needs the <b>user-library-read</b> permission, which this Spotify connection predates. Reconnect to grant it — playback keeps working either way.</span>";
  const reconnect = document.createElement("a");
  reconnect.className = "link-btn";
  reconnect.href = API_BASE + "/auth/start?user=" + encodeURIComponent(getUserId());
  reconnect.textContent = "Reconnect Spotify";
  reconnect.style.cssText =
    "margin-top:0;color:var(--fg);border-color:var(--dim);text-decoration:none;display:inline-block";
  const play = document.createElement("button");
  play.type = "button";
  play.className = "link-btn";
  play.textContent = "▶ play liked songs anyway";
  play.style.cssText = "margin-top:0";
  play.addEventListener("click", () =>
    playPlaylistNow({ id: "liked", name: "Liked Songs" }));
  box.appendChild(reconnect);
  box.appendChild(play);
  tracks.appendChild(box);
}

// The daily "daylist" Spotify generates for the account — pinned beside the
// playlists so it's one tap away. Its playlist id rotates several times a
// day, so a pinned id 404s within hours; resolve the live one server-side.
daylistBtn.addEventListener("click", () => openDaylist());

async function openDaylist() {
  log("open daylist");
  setStatus("loading daylist…");
  try {
    const r = await api("/player/daylist");
    if (r && r.error) throw new Error(r.error);
    if (!r || !r.id) throw new Error("no daylist on this account");
    currentPlaylistName = r.name;
    currentPlaylist = {
      id: r.id,
      name: r.name,
      tracks: r.tracks || [],
      listable: r.listable !== false,
    };
    renderTracks();
    await switchView(trackView, plistView);
    setStatus("ready");
  } catch (e) {
    const msg = String((e && e.message) || e);
    setStatus("failed to load daylist: " + msg, true);
  }
}

function renderTracks() {
  trackHead.textContent = currentPlaylist.name;
  tracks.innerHTML = "";
  if (!currentPlaylist.listable) {
    const box = document.createElement("div");
    box.className = "pl-item";
    box.style.cssText = "cursor:default;flex-direction:column;align-items:flex-start;gap:12px;padding:14px";
    box.innerHTML =
      "<span class=\"pl-sub\">Spotify no longer exposes the track list for playlists you don't own — you can still play it, and the \"up next\" panel will show the real songs as they play.</span>";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "link-btn";
    btn.textContent = "▶ play this playlist";
    btn.style.cssText = "margin-top:0;color:var(--fg);border-color:var(--dim)";
    btn.addEventListener("click", () => playPlaylistNow(currentPlaylist));
    box.appendChild(btn);
    tracks.appendChild(box);
    return;
  }
  if (!currentPlaylist.tracks.length) {
    const el = document.createElement("div");
    el.className = "pl-item";
    el.style.cssText = "cursor:default";
    el.innerHTML = '<span class="pl-sub">no tracks here yet</span>';
    tracks.appendChild(el);
    return;
  }
  currentPlaylist.tracks.forEach((tr, i) => {
    const el = document.createElement("div");
    el.className = "pl-item";
    el.innerHTML =
      '<span class="trk-idx">' + (i + 1) + "</span>" +
      (tr.image ? `<img src="${tr.image}" alt="">` : '<div class="noimg">♪</div>') +
      '<div class="pl-main"><div class="pl-name"></div><div class="pl-sub"></div></div>' +
      '<span class="trk-dur">' + fmt(tr.duration_ms) + "</span>";
    el.querySelector(".pl-name").textContent = tr.name;
    el.querySelector(".pl-sub").textContent = tr.artists;
    el.addEventListener("click", () => playTrack(i));
    tracks.appendChild(el);
  });
}

async function playTrack(idx) {
  const tr = currentPlaylist.tracks[idx];
  if (!tr) return;
  log("play track:", tr.name, "in", currentPlaylist.name);
  playlistOffset = idx;
  setStatus("starting " + tr.name + "…");
  try {
    await ensurePlayer();
    // Liked Songs is a user collection, not a playlist — it needs its own URI.
    const contextUri = currentPlaylist.id === "liked"
      ? "spotify:liked"
      : "spotify:playlist:" + currentPlaylist.id;
    const r = await api("/control/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        device_id: deviceId,
        context_uri: contextUri,
        offset: idx,
      }),
    });
    if (r && r.error) throw new Error(r.error);
    await ensureSdkResumed();
    meta.textContent = "playing · " + currentPlaylist.name;
    toast("playing " + tr.name);
    renderQueue();
  } catch (e) {
    const msg = String((e && e.message) || e);
    setStatus(
      msg.includes("404") || msg.includes("active device")
        ? "no active device — keep this tab open, then retry"
        : "failed to play: " + msg,
      true,
    );
  }
}

async function playPlaylistNow(p) {
  // Play a playlist directly by URI (no track list needed). Used for
  // playlists Spotify won't expose track lists for (others' playlists).
  log("play playlist:", p.name);
  setStatus("starting " + p.name + "…");
  try {
    await ensurePlayer();
    const r = await api("/control/play", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        device_id: deviceId,
        context_uri: p.id === "liked" ? "spotify:liked" : "spotify:playlist:" + p.id,
      }),
    });
    if (r && r.error) throw new Error(r.error);
    await ensureSdkResumed();
    currentPlaylistName = p.name;
    meta.textContent = "playing · " + p.name;
    toast("playing " + p.name);
    renderQueue();
  } catch (e) {
    const msg = String((e && e.message) || e);
    setStatus(
      msg.includes("404") || msg.includes("active device")
        ? "no active device — keep this tab open, then retry"
        : "failed to play: " + msg,
      true,
    );
  }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function switchView(show, hide) {
  hide.classList.add("out");
  await sleep(180);
  hide.hidden = true;
  hide.classList.remove("out");
  show.hidden = false;
}

backBtn.addEventListener("click", () => {
  switchView(plistView, trackView);
});

// ---- upcoming queue -------------------------------------------------------
function renderQueue() {
  if (!current) {
    queue.classList.remove("show");
    qList.innerHTML = "";
    return;
  }
  let items = sdkNext.map((t) => ({ ...t, idx: null }));
  if (!items.length && currentPlaylist && playlistOffset >= 0) {
    // SDK window is empty (fresh load) — fall back to the playlist order.
    items = currentPlaylist.tracks
      .slice(playlistOffset + 1)
      .map((tr, i) => ({
        name: tr.name, artists: tr.artists, uri: tr.uri,
        image: tr.image, idx: playlistOffset + 1 + i,
      }));
  }
  queueItems = items.slice(0, 6);
  if (!queueItems.length) {
    queue.classList.remove("show");
    qList.innerHTML = "";
    return;
  }
  qList.innerHTML = queueItems
    .map((t) => {
      const img = t.image
        ? `<img src="${t.image}" alt="">`
        : '<div class="noimg">♪</div>';
      return `<div class="q-item" role="button" tabindex="0">
        ${img}
        <div class="q-main"><div class="q-name"></div><div class="q-sub"></div></div>
      </div>`;
    })
    .join("");
  [...qList.querySelectorAll(".q-item")].forEach((el, i) => {
    const t = queueItems[i];
    el.querySelector(".q-name").textContent = t.name;
    el.querySelector(".q-sub").textContent = t.artists;
    const go = () => playQueueItem(i);
    el.addEventListener("click", go);
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
  queue.classList.add("show");
}

async function playQueueItem(i) {
  const t = queueItems[i];
  if (!t) return;
  if (t.idx != null && currentPlaylist) { playTrack(t.idx); return; }
  if (currentPlaylist && t.uri) {
    const idx = currentPlaylist.tracks.findIndex((tr) => tr.uri === t.uri);
    if (idx >= 0) { playTrack(idx); return; }
  }
  if (player) player.nextTrack();
}

// ---- focused mode (click the album art) -----------------------------------
art.addEventListener("click", () => {
  mainEl.classList.toggle("focused");
});

// The playlist button in focus mode re-opens the playlists on the right side.
plistFocusBtn.addEventListener("click", () => {
  mainEl.classList.remove("focused");
});

// Liked Songs — open the track list so you can pick a saved song.
likedBtn.addEventListener("click", () => openLiked());

// ---------------------------------------------------------------------------
// Connect flow + boot
// ---------------------------------------------------------------------------
function showConnect() {
  playBtn.disabled = artPlay.disabled = prevBtn.disabled = nextBtn.disabled =
    shuffleBtn.disabled = repeatBtn.disabled = plistBtn.disabled =
    likedBtn.disabled = daylistBtn.disabled = true;
  volume.disabled = true;
  seek.disabled = true;
  logoutBtn.hidden = true;
  whoami.textContent = "";
  const a = document.createElement("a");
  a.className = "connect";
  a.href = API_BASE + "/auth/start?user=" + encodeURIComponent(getUserId());
  a.textContent = "Connect Spotify";
  const old = document.querySelector("a.connect");
  if (old) old.remove();
  const oldSwitch = document.querySelector("a.switch-account");
  if (oldSwitch) oldSwitch.remove();
  statusEl.appendChild(a);
  // Logging out here only clears *our* session — Spotify's own web login
  // persists, so the next Connect would silently reuse the same account.
  // This clears Spotify's session so the login page appears again.
  const sw = document.createElement("a");
  sw.className = "switch-account";
  sw.href = "https://accounts.spotify.com/en/logout";
  sw.target = "_blank";
  sw.rel = "noopener";
  sw.textContent = "log in with a different account";
  statusEl.appendChild(sw);
}

(async function boot() {
  const q = new URLSearchParams(location.search);
  if (q.get("connected")) toast("Connected to Spotify ✓");
  if (q.get("error")) toast("Auth failed: " + q.get("error"));
  // The OAuth callback hands the session secret back in a URL fragment —
  // fragments never leave the browser, so it can't leak via Referer/logs.
  if (location.hash.startsWith("#session=")) {
    const sec = decodeURIComponent(location.hash.slice(9));
    if (sec && sec.length >= 16) store.set("music_player_secret", sec);
  }
  history.replaceState({}, "", location.pathname);

  // A network/CORS failure must never leave the page dead — treat it like
  // "not connected" so the Connect button always renders.
  let t;
  try {
    t = await api("/player/token");
  } catch (e) {
    log("boot: token fetch failed:", (e && e.message) || e);
    t = { __unauthorized: true };
  }
  log("boot: token", t.__unauthorized ? "UNAUTHORIZED" : "ok", "scopes:", t.scopes);
  if (t.__unauthorized) {
    setStatus("Not connected", true);
    showConnect();
    return;
  }
  // The Web Playback SDK needs the `streaming` scope for audio. A token
  // without it will show "Invalid token scopes" and never make a sound.
  if (t.scopes && !String(t.scopes).split(" ").includes("streaming")) {
    setStatus("Audio disabled — reconnect Spotify to grant streaming", true);
    showConnect();
    return;
  }
  // Browsing Liked Songs needs `user-library-read`; playback never does. Old
  // sessions without it still play — just nudge once to reconnect when wanted.
  if (t.scopes && !String(t.scopes).split(" ").includes("user-library-read")) {
    toast("reconnect Spotify to browse liked songs");
  }
  // Show which Spotify account is connected, next to log out.
  whoami.textContent = "";
  if (t.display_name) {
    whoami.innerHTML = t.image ? `<img src="${t.image}" alt="">` : "";
    const nm = document.createElement("span");
    nm.textContent = t.display_name;
    whoami.appendChild(nm);
    whoami.title = t.display_name;
  }
  // Lazy SDK init: the player is created inside the first click so the audio
  // element is autoplay-activated. Enable controls now; playback begins on tap.
  playBtn.disabled = artPlay.disabled = prevBtn.disabled = nextBtn.disabled =
    shuffleBtn.disabled = repeatBtn.disabled = plistBtn.disabled =
    likedBtn.disabled = daylistBtn.disabled = false;
  volume.disabled = false;
  setVolIcon();
  seek.disabled = false;
  logoutBtn.hidden = false;
  setStatus("tap play or a playlist to start");
  refreshNowPlaying();
  loadPlaylists();
})();
</script>
