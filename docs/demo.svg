<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">spotify-minimal player</title>
  <desc id="d">A dark music player with a spinning vinyl record, track info, and transport controls.</desc>
  <defs>
    <radialGradient id="glow" cx="30%" cy="45%" r="60%">
      <stop offset="0" stop-color="#1ed760" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1ed760" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22e06a"/>
      <stop offset="1" stop-color="#1bd05b"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181c"/>
      <stop offset="1" stop-color="#0e0f12"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#060608"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <ellipse cx="300" cy="560" rx="250" ry="30" fill="#000" opacity=".5"/>

  <!-- vinyl deck -->
  <circle cx="300" cy="320" r="216" fill="#121318" stroke="#26272d" stroke-width="2"/>
  <circle cx="300" cy="320" r="205" fill="url(#deck)" stroke="#1f2126" stroke-width="1.5"/>
  <g stroke="#1c1d22" stroke-width="1.5" fill="none">
    <circle cx="300" cy="320" r="198"/>
    <circle cx="300" cy="320" r="190"/>
    <circle cx="300" cy="320" r="182"/>
    <circle cx="300" cy="320" r="174"/>
    <circle cx="300" cy="320" r="166"/>
    <circle cx="300" cy="320" r="158"/>
    <circle cx="300" cy="320" r="150"/>
  </g>
  <path d="M 122 210 A 180 180 0 0 1 246 142" stroke="#ffffff" stroke-opacity=".045" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- label -->
  <circle cx="300" cy="320" r="84" fill="url(#greenGrad)"/>
  <circle cx="300" cy="320" r="84" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="2"/>
  <circle cx="300" cy="320" r="78" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
  <g fill="#05270f">
    <circle cx="286" cy="336" r="9.5"/>
    <circle cx="316" cy="338" r="9.5"/>
    <rect x="291.5" y="292" width="4" height="44"/>
    <rect x="321.5" y="294" width="4" height="44"/>
    <rect x="290" y="288" width="36" height="7" rx="3.5"/>
  </g>
  <circle cx="300" cy="320" r="7.5" fill="#e8ebef" stroke="rgba(0,0,0,.4)" stroke-width="1.5"/>

  <!-- tonearm -->
  <circle cx="468" cy="158" r="12" fill="#cfd3da" stroke="rgba(0,0,0,.5)" stroke-width="2"/>
  <circle cx="455" cy="145" r="8" fill="#5b6068"/>
  <circle cx="468" cy="158" r="5" fill="#71757d"/>
  <line x1="462" y1="152" x2="332" y2="270" stroke="#c2c7cf" stroke-width="7" stroke-linecap="round"/>
  <line x1="462" y1="152" x2="332" y2="270" stroke="#878c95" stroke-width="3" stroke-linecap="round"/>
  <path d="M 320 262 L 340 272 L 334 284 L 314 274 Z" fill="#454a52" stroke="#2a2d33" stroke-width="1"/>
  <circle cx="318" cy="278" r="2.5" fill="#141518"/>

  <!-- equalizer bars -->
  <rect x="120" y="452" width="4" height="18" rx="2" fill="#1ed760"/>
  <rect x="128" y="442" width="4" height="28" rx="2" fill="#1ed760" opacity=".85"/>
  <rect x="136" y="448" width="4" height="22" rx="2" fill="#1ed760" opacity=".95"/>
  <rect x="144" y="432" width="4" height="38" rx="2" fill="#1ed760"/>

  <!-- now playing -->
  <circle cx="620" cy="226" r="5" fill="#1ed760"/>
  <text x="634" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#1ed760">NOW PLAYING</text>
  <text x="620" y="292" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#ffffff">Neon Harbour</text>
  <text x="620" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#90909a">Static Bloom · 2026</text>

  <!-- progress -->
  <rect x="620" y="376" width="470" height="5" rx="2.5" fill="#34353c"/>
  <rect x="620" y="376" width="165" height="5" rx="2.5" fill="#1ed760"/>
  <circle cx="785" cy="378.5" r="7" fill="#ffffff" stroke="#1ed760" stroke-width="2"/>
  <text x="620" y="408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#8a8a93">1:24</text>
  <text x="1090" y="408" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#8a8a93">3:41</text>

  <!-- controls -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 647 494 L 665 476"/>
    <path d="M 647 470 L 665 488"/>
  </g>
  <path d="M 665 476 L 657 477 L 663 470 Z" fill="#ffffff" stroke="none"/>
  <path d="M 665 488 L 657 487 L 663 494 Z" fill="#ffffff" stroke="none"/>

  <rect x="734" y="470" width="4" height="20" fill="#ffffff"/>
  <path d="M 742 470 L 766 480 L 742 490 Z" fill="#ffffff"/>

  <circle cx="860" cy="480" r="38" fill="url(#greenGrad)"/>
  <circle cx="860" cy="480" r="38" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
  <path d="M 848 462 L 886 480 L 848 498 Z" fill="#05270f"/>

  <rect x="982" y="470" width="4" height="20" fill="#ffffff"/>
  <path d="M 978 470 L 954 480 L 978 490 Z" fill="#ffffff"/>

  <rect x="1082" y="470" width="26" height="20" rx="9" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M 1108 470 L 1100 464 L 1100 476 Z" fill="#ffffff" stroke="none"/>
</svg>
